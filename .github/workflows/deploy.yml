name: Deploy Web to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'apps/web/public/data/deals-snapshot.json'
      - 'docs/**'
      - 'README.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: web-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Test, Build & Deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests & Typecheck
        run: |
          npm test
          npm run build --workspace=packages/scrapers

      - name: Build & Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID || 'G-XX21E9DWXN' }}
          VITE_CLARITY_ID: ${{ vars.VITE_CLARITY_ID || 'z97nys8fg7' }}
          VITE_GTM_ID: ${{ vars.VITE_GTM_ID || '' }}
          VITE_FB_PIXEL_ID: ${{ vars.VITE_FB_PIXEL_ID || '' }}
          VITE_GOOGLE_ADS_ID: ${{ vars.VITE_GOOGLE_ADS_ID || '' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Faltan secretos de Cloudflare o Supabase para desplegar."
            exit 1
          fi
          npm run deploy --workspace=apps/web

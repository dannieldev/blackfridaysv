name: Automated Price Scraper & Snapshot Sync

on:
  schedule:
    # 2 veces al día durante temporada de compras (9:00 AM y 9:00 PM CST = 15:00 y 03:00 UTC)
    - cron: '0 15,3 * * *'
  workflow_dispatch:
    inputs:
      store:
        description: 'Tienda específica a scrapear (dejar vacío para todas)'
        required: false
        default: ''
      mode:
        description: 'Modo de ejecución'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - dry-run

permissions:
  contents: write

concurrency:
  group: catalog-update
  cancel-in-progress: false

jobs:
  scrape-sync-and-deploy:
    name: Scrape Stores, Update Snapshot & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HAS_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      HAS_EMAIL_PROVIDER: ${{ secrets.RESEND_API_KEY != '' && secrets.EMAIL_TOKEN_SECRET != '' && vars.EMAIL_FROM != '' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate catalog pipeline
        run: |
          npm test
          npm run build --workspace=packages/scrapers
          npm run build

      - name: Run Scrapers & Generate Snapshot
        id: crawl
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPER_STORE: ${{ github.event.inputs.store || '' }}
          SCRAPER_MODE: ${{ github.event.inputs.mode || 'production' }}
          SCRAPE_MAX_ITEMS_PER_CATEGORY: 50
        run: |
          npm run scrape

      - name: Commit and Push Updated Snapshot
        id: commit_snapshot
        if: github.event.inputs.mode != 'dry-run' && steps.crawl.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -f apps/web/public/data/deals-snapshot.json ]; then
            git add apps/web/public/data/deals-snapshot.json

            if git diff --staged --quiet; then
              echo "SNAPSHOT_CHANGED=false" >> $GITHUB_ENV
              echo "✔ No hay cambios nuevos en deals-snapshot.json."
            else
              echo "SNAPSHOT_CHANGED=true" >> $GITHUB_ENV
              TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
              git commit -m "chore(data): auto-update deals snapshot ($TIMESTAMP) [skip ci]"
              git push origin main
              echo "✔ Snapshot actualizado y enviado a origin/main con éxito."
            fi
          else
            echo "SNAPSHOT_CHANGED=false" >> $GITHUB_ENV
            echo "⚠ El archivo deals-snapshot.json no se encontró."
          fi

      - name: Deploy to Cloudflare Workers
        id: deploy
        if: env.HAS_CLOUDFLARE_TOKEN == 'true' && env.SNAPSHOT_CHANGED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "🚀 Desplegando versión actualizada a Cloudflare Workers..."
          npm run deploy --workspace=apps/web

      - name: Send confirmed price notifications
        if: steps.deploy.outcome == 'success' && env.HAS_EMAIL_PROVIDER == 'true' && vars.SUBSCRIPTIONS_ENABLED == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TOKEN_SECRET: ${{ secrets.EMAIL_TOKEN_SECRET }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          SITE_URL: https://blackfridaysv.dannieldev.com
          SUBSCRIPTIONS_ENABLED: ${{ vars.SUBSCRIPTIONS_ENABLED }}
          EMAIL_BATCH_LIMIT: ${{ vars.EMAIL_BATCH_LIMIT || '50' }}
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch(new URL('/api/subscriptions/config', process.env.SITE_URL), { signal: AbortSignal.timeout(15000) });
          if (!response.ok || !(await response.json()).enabled) throw new Error('Los avisos no están habilitados en el sitio publicado.');
          NODE
          npm run notifications:send

      - name: Preserve notification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notification-report
          path: .reports/notifications.json
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Informative Notice
        if: env.HAS_CLOUDFLARE_TOKEN != 'true'
        run: |
          echo "No hay CLOUDFLARE_API_TOKEN. Este workflow no puede desplegar el catálogo."

      - name: Preserve crawler report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawler-report
          path: .reports/crawler.json
          include-hidden-files: true
          if-no-files-found: warn

      - name: Summarize catalog health
        if: always()
        run: |
          if [ -f .reports/crawler.json ]; then
            echo '### Estado de actualización del catálogo' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat .reports/crawler.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Flag incomplete updates
        if: always() && steps.crawl.outcome == 'failure'
        run: |
          echo "::error::Actualización incompleta. Revisa el informe por tienda; las capturas anteriores se conservaron."
          exit 1
